<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DND For Us</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #100d18;
  color: white;
}

/* =========================
   LOGIN
========================= */

#authPage {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.auth-box {
  width: 100%;
  max-width: 420px;
  background: #1a1523;
  border: 1px solid #3a2a4c;
  border-radius: 16px;
  padding: 30px;
  box-shadow: 0 10px 40px #0008;
}

.auth-box h1 {
  text-align: center;
  color: #c9a7ff;
  margin-top: 0;
}

.auth-box h2 {
  text-align: center;
  margin-bottom: 20px;
}

.auth-box input {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 8px;
  border: 1px solid #49365d;
  background: #0f0c15;
  color: white;
  font-size: 15px;
}

.auth-box button {
  width: 100%;
  padding: 12px;
  border: 0;
  border-radius: 8px;
  background: #6d3bb5;
  color: white;
  font-weight: bold;
  cursor: pointer;
  margin-top: 5px;
}

.auth-box button:hover {
  background: #824bd0;
}

.auth-switch {
  text-align: center;
  margin-top: 18px;
  color: #aaa;
}

.auth-switch button {
  width: auto;
  background: none;
  color: #c9a7ff;
  padding: 0;
}

#authMessage {
  text-align: center;
  margin-top: 15px;
  color: #ffb3b3;
}

/* =========================
   APP
========================= */

#app {
  display: none;
}

header {
  padding: 20px;
  text-align: center;
  background: #1b1428;
  border-bottom: 1px solid #3b2a52;
}

h1 {
  margin: 0 0 12px;
  color: #c9a7ff;
}

button {
  border: 0;
  border-radius: 8px;
  padding: 9px 13px;
  background: #6d3bb5;
  color: white;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #824bd0;
}

button.danger {
  background: #8d3030;
}

button.small {
  padding: 6px 9px;
  font-size: 12px;
}

.user-info {
  margin-bottom: 15px;
  color: #aaa;
}

.role {
  display: inline-block;
  background: #3d2860;
  color: #d8bdff;
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 12px;
  margin-left: 5px;
}

.container {
  max-width: 1100px;
  margin: 20px auto;
  padding: 0 14px;
}

.players {
  display: grid;
  gap: 20px;
}

.player {
  background: #1a1523;
  border: 1px solid #3a2a4c;
  border-radius: 14px;
  padding: 18px;
}

.player-header {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 16px;
}

.player-header input {
  flex: 1;
  font-size: 20px;
  font-weight: bold;
  background: #0f0c15;
  color: white;
  border: 1px solid #49365d;
  border-radius: 8px;
  padding: 10px;
}

.player-overview {
  display: grid;
  grid-template-columns: 170px 1fr;
  gap: 20px;
}

.image-box {
  text-align: center;
}

.character-image {
  width: 160px;
  height: 160px;
  border-radius: 12px;
  border: 2px solid #60477a;
  background: #0f0c15;
  object-fit: cover;
  display: block;
  margin: auto;
}

.image-placeholder {
  width: 160px;
  height: 160px;
  border-radius: 12px;
  border: 2px dashed #60477a;
  background: #0f0c15;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: auto;
  font-size: 46px;
}

.image-controls {
  margin-top: 10px;
}

.file-label {
  display: inline-block;
  background: #6d3bb5;
  padding: 8px;
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
}

.file-input {
  display: none;
}

.stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.stat {
  background: #110e17;
  border: 1px solid #3d2c4e;
  border-radius: 9px;
  padding: 10px;
}

.stat label {
  display: block;
  color: #bfaed0;
  font-size: 12px;
  margin-bottom: 5px;
}

.stat input {
  width: 100%;
  background: #211a2c;
  color: white;
  border: 1px solid #4a385b;
  border-radius: 6px;
  padding: 8px;
  font-size: 18px;
}

.section-title {
  color: #c9a7ff;
}

.abilities {
  display: grid;
  gap: 10px;
}

.ability {
  background: #120f18;
  border: 1px solid #3d2c4e;
  border-radius: 10px;
  padding: 12px;
}

.ability-grid {
  display: grid;
  grid-template-columns: 1.2fr .7fr .9fr;
  gap: 8px;
}

.ability input,
.ability textarea {
  width: 100%;
  background: #211a2c;
  color: white;
  border: 1px solid #4a385b;
  border-radius: 6px;
  padding: 8px;
}

.ability textarea {
  min-height: 65px;
  margin-top: 8px;
  resize: vertical;
}

.empty {
  text-align: center;
  color: #8e8298;
  padding: 40px;
}


.party-panel{background:#1a1523;border:1px solid #3a2a4c;border-radius:14px;padding:18px;margin-bottom:20px}
.party-panel h2{margin-top:0;color:#c9a7ff}
.party-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.party-actions input{flex:1;min-width:180px;background:#0f0c15;color:white;border:1px solid #49365d;border-radius:8px;padding:10px}
.party-members{margin-top:10px;color:#bfaed0}
.party-code{display:inline-block;font-family:monospace;letter-spacing:2px;background:#2a1d3a;padding:5px 8px;border-radius:6px;margin-left:6px}

@media(max-width:650px) {
  .player-overview {
    grid-template-columns: 1fr;
  }

  .stats {
    grid-template-columns: repeat(2, 1fr);
  }

  .ability-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN / REGISTER
========================= -->

<div id="authPage">

  <div class="auth-box">

    <h1>⚔️ DND For Us</h1>

    <h2 id="authTitle">Inloggen</h2>

    <input
      id="username"
      type="text"
      placeholder="Username"
      style="display:none"
    >

    <input
      id="email"
      type="email"
      placeholder="Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Wachtwoord"
    >

    <button onclick="handleAuth()">
      <span id="authButtonText">Inloggen</span>
    </button>

    <div id="authMessage"></div>

    <div class="auth-switch">

      <span id="switchText">
        Nog geen account?
      </span>

      <button onclick="toggleAuthMode()">
        <span id="switchButton">
          Account maken
        </span>
      </button>

    </div>

  </div>

</div>


<!-- =========================
     APP
========================= -->

<div id="app">

<header>

  <h1>⚔️ DND For Us</h1>

  <div class="user-info">

    Ingelogd als
    <b id="currentUsername"></b>

    <span
      class="role"
      id="currentRole"
    ></span>

  </div>

  <button onclick="addPlayer()">
    ＋ Player
  </button>

  <button
    onclick="logout()"
    class="danger"
  >
    Uitloggen
  </button>

</header>


<div class="container">

  <div id="partyPanel" class="party-panel"></div>

  <div
    id="players"
    class="players"
  ></div>

</div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://smrmzoljzglgqzdjvqjl.supabase.co";

const SUPABASE_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtcm16b2xqemdsZ3F6ZGp2cWpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NjgwNTgsImV4cCI6MjEwNjQ0NDA1OH0.JBBu1_-X5X31cDx0URk2o1xIHJF55REsMhiiqJR-XTk";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   AUTH
========================= */

let registerMode = false;

let currentUser = null;

let currentProfile = null;


/* =========================
   AUTH MODE
========================= */

function toggleAuthMode() {

  registerMode =
    !registerMode;


  const title =
    document.getElementById(
      "authTitle"
    );

  const username =
    document.getElementById(
      "username"
    );

  const button =
    document.getElementById(
      "authButtonText"
    );

  const switchText =
    document.getElementById(
      "switchText"
    );

  const switchButton =
    document.getElementById(
      "switchButton"
    );


  if(registerMode) {

    title.textContent =
      "Account maken";

    username.style.display =
      "block";

    button.textContent =
      "Account maken";

    switchText.textContent =
      "Heb je al een account?";

    switchButton.textContent =
      "Inloggen";

  } else {

    title.textContent =
      "Inloggen";

    username.style.display =
      "none";

    button.textContent =
      "Inloggen";

    switchText.textContent =
      "Nog geen account?";

    switchButton.textContent =
      "Account maken";

  }

}


/* =========================
   REGISTER / LOGIN
========================= */

async function handleAuth() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const username =
    document
      .getElementById("username")
      .value
      .trim();


  const message =
    document.getElementById(
      "authMessage"
    );


  message.textContent =
    "Even bezig...";


  if(!email || !password) {

    message.textContent =
      "Vul email en wachtwoord in.";

    return;

  }


  if(registerMode) {

    if(!username) {

      message.textContent =
        "Vul een username in.";

      return;

    }


    const {
      data,
      error
    } =
      await supabaseClient.auth.signUp({

        email: email,

        password: password,

        options: {

          data: {

            username:
              username

          }

        }

      });


    if(error) {

      message.textContent =
        error.message;

      return;

    }


    message.style.color =
      "#9dffb0";

    message.textContent =
      "Account aangemaakt! Controleer eventueel je email.";

  } else {

    const {
      data,
      error
    } =
      await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

      });


    if(error) {

      message.style.color =
        "#ffb3b3";

      message.textContent =
        error.message;

      return;

    }


    await loadUser();

  }

}


/* =========================
   USER LADEN
========================= */

async function loadUser() {

  const {
    data: {
      user
    }
  } =
    await supabaseClient.auth.getUser();


  if(!user) {

    showAuth();

    return;

  }


  currentUser =
    user;


  const {
    data: profile,
    error
  } =
    await supabaseClient

      .from("profiles")

      .select("*")

      .eq("id", user.id)

      .single();


  if(error) {

    console.error(error);

    return;

  }


  currentProfile =
    profile;


  document
    .getElementById(
      "currentUsername"
    )
    .textContent =
      profile.username;


  document
    .getElementById(
      "currentRole"
    )
    .textContent =
      profile.role;


  showApp();

}


/* =========================
   PAGINA TONEN
========================= */

function showApp() {

  document
    .getElementById(
      "authPage"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "app"
    )
    .style.display =
      "block";


  render();
  loadParty();

}


function showAuth() {

  document
    .getElementById(
      "authPage"
    )
    .style.display =
      "flex";


  document
    .getElementById(
      "app"
    )
    .style.display =
      "none";

}


/* =========================
   LOGOUT
========================= */

async function logout() {

  await supabaseClient.auth.signOut();

  currentUser = null;

  currentProfile = null;

  showAuth();

}


/* =========================
   AUTH STATE
========================= */

supabaseClient.auth.onAuthStateChange(
  async (event, session) => {

    if(session) {

      await loadUser();

    } else {

      showAuth();

    }

  }
);



/* =========================
   PARTY SYSTEM
========================= */

let currentParty = null;
let currentPartyMembers = [];

function randomJoinCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "";
  for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

async function createParty() {
  if (!currentUser || currentProfile?.role !== "DM") {
    alert("Alleen een DM kan een party maken.");
    return;
  }

  const input = document.getElementById("newPartyName");
  const name = input?.value.trim();
  if (!name) {
    alert("Vul een naam voor de party in.");
    return;
  }

  let party = null;
  let error = null;

  for (let attempt = 0; attempt < 5; attempt++) {
    const join_code = randomJoinCode();
    const result = await supabaseClient.from("parties").insert({
      name, join_code, dm_id: currentUser.id
    }).select().single();

    if (!result.error) {
      party = result.data;
      break;
    }
    error = result.error;
    if (error.code !== "23505") break;
  }

  if (!party) {
    console.error(error);
    alert("Party maken mislukt: " + (error?.message || "onbekende fout"));
    return;
  }

  const memberResult = await supabaseClient.from("party_members").insert({
    party_id: party.id,
    user_id: currentUser.id
  });

  if (memberResult.error && memberResult.error.code !== "23505") {
    console.error(memberResult.error);
  }

  input.value = "";
  await loadParty();
}

async function joinParty() {
  const input = document.getElementById("joinPartyCode");
  const code = input?.value.trim().toUpperCase();

  if (!code) {
    alert("Vul een join-code in.");
    return;
  }

  const { data: party, error } = await supabaseClient
    .from("parties").select("*").eq("join_code", code).single();

  if (error || !party) {
    alert("Geen party gevonden met deze code.");
    return;
  }

  const { error: joinError } = await supabaseClient
    .from("party_members").insert({ party_id: party.id, user_id: currentUser.id });

  if (joinError && joinError.code !== "23505") {
    alert("Kon niet bij de party komen: " + joinError.message);
    return;
  }

  input.value = "";
  await loadParty();
}

async function startParty() {
  if (!currentParty || !currentUser) return;

  if (currentParty.dm_id !== currentUser.id) {
    alert("Alleen de DM kan de party starten.");
    return;
  }

  if (currentParty.status === "started") return;

  const { data, error } = await supabaseClient
    .from("parties")
    .update({ status: "started" })
    .eq("id", currentParty.id)
    .eq("dm_id", currentUser.id)
    .select()
    .single();

  if (error) {
    console.error(error);
    alert("Party starten mislukt: " + error.message);
    return;
  }

  currentParty = data;
  renderPartyPanel();
}

async function leaveParty() {
  if (!currentParty) return;

  if (currentParty.dm_id === currentUser.id) {
    alert("De DM kan de eigen party nog niet verlaten.");
    return;
  }

  const { error } = await supabaseClient.from("party_members")
    .delete().eq("party_id", currentParty.id).eq("user_id", currentUser.id);

  if (error) {
    alert("Party verlaten mislukt: " + error.message);
    return;
  }

  currentParty = null;
  currentPartyMembers = [];
  renderPartyPanel();
}

async function loadParty() {
  if (!currentUser) return;

  const { data: memberships, error } = await supabaseClient
    .from("party_members").select("party_id").eq("user_id", currentUser.id);

  if (error || !memberships?.length) {
    currentParty = null;
    currentPartyMembers = [];
    renderPartyPanel();
    return;
  }

  const { data: party, error: partyError } = await supabaseClient
    .from("parties").select("*").eq("id", memberships[0].party_id).single();

  if (partyError || !party) {
    currentParty = null;
    currentPartyMembers = [];
    renderPartyPanel();
    return;
  }

  currentParty = party;

  const { data: members } = await supabaseClient
    .from("party_members").select("user_id").eq("party_id", party.id);

  const ids = (members || []).map(m => m.user_id);
  if (!ids.length) {
    currentPartyMembers = [];
  } else {
    const { data: profiles } = await supabaseClient
      .from("profiles").select("id, username, role").in("id", ids);
    currentPartyMembers = profiles || [];
  }

  renderPartyPanel();
}

function renderPartyPanel() {
  const panel = document.getElementById("partyPanel");
  if (!panel || !currentUser) return;

  if (!currentParty) {
    if (currentProfile?.role === "DM") {
      panel.innerHTML = `
        <h2>👑 DM Party</h2>
        <div class="party-actions">
          <input id="newPartyName" placeholder="Naam van je nieuwe party">
          <button onclick="createParty()">＋ Party aanmaken</button>
        </div>
        <div style="color:#8e8298">Maak een party aan en deel daarna de join-code.</div>
        <hr style="border-color:#3a2a4c;margin:18px 0;">
        <h2>🎮 Bij een party aansluiten</h2>
        <div class="party-actions">
          <input id="joinPartyCode" placeholder="Bijv. DRK7X2" maxlength="6">
          <button onclick="joinParty()">Join party</button>
        </div>
      `;
    } else {
      panel.innerHTML = `
        <h2>🎮 Bij een party aansluiten</h2>
        <div class="party-actions">
          <input id="joinPartyCode" placeholder="Join-code" maxlength="6">
          <button onclick="joinParty()">Join party</button>
        </div>
        <div style="color:#8e8298">Vraag de join-code aan je DM.</div>
      `;
    }
    return;
  }

  const memberNames = currentPartyMembers.length
    ? currentPartyMembers.map(m =>
        `<div>• ${escapeHtml(m.username)}${m.role === "DM" ? " 👑" : ""}</div>`
      ).join("")
    : "<div>Geen leden gevonden.</div>";

  const isDM = currentParty.dm_id === currentUser.id;
  const started = currentParty.status === "started";

  panel.innerHTML = `
    <h2>⚔️ ${escapeHtml(currentParty.name)}</h2>

    <div style="
      display:inline-block;
      margin:8px 0 12px;
      padding:7px 11px;
      border-radius:8px;
      background:${started ? "#244b32" : "#3d2860"};
      color:${started ? "#b8ffc9" : "#d8bdff"};
      font-weight:bold;
    ">
      ${started ? "🟢 Party gestart" : "🕐 Wacht op de DM"}
    </div>

    <div>Join-code:<span class="party-code">${escapeHtml(currentParty.join_code)}</span></div>

    <div class="party-members">
      <strong>👥 Leden</strong>
      ${memberNames}
    </div>

    ${isDM && !started
      ? `<button style="margin-top:15px" onclick="startParty()">▶️ Start Party</button>`
      : ""}

    ${!isDM
      ? '<button class="danger" style="margin-top:15px" onclick="leaveParty()">Party verlaten</button>'
      : ""}

    <div style="color:#8e8298;margin-top:10px">
      ${started
        ? "🎲 De D&D-sessie is gestart!"
        : isDM
          ? "Wacht tot alle spelers klaar zijn en start daarna de party."
          : "Wacht tot de DM de party start."}
    </div>
  `;
}
/* =========================
   PARTY STATUS REFRESH
========================= */

setInterval(() => {
  if (currentUser && currentParty) {
    loadParty();
  }
}, 5000);



/* =========================
   CHARACTER DATA
   VOORLOPIG LOKAAL
========================= */

const STORAGE_KEY =
  "dnd-for-us-v1";

const STAT_NAMES = [
  "STR",
  "DEX",
  "CON",
  "INT",
  "WIS",
  "CHA"
];


let players =
  JSON.parse(
    localStorage.getItem(
      STORAGE_KEY
    )
  ) || [];


function save() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(players)
  );

}


/* =========================
   PLAYER
========================= */

function addPlayer() {

  if(players.length >= 5) {

    alert(
      "Maximaal 5 spelers."
    );

    return;

  }


  players.push({

    id: Date.now(),

    name: "Nieuwe speler",

    image: "",

    stats: {

      STR: 10,
      DEX: 10,
      CON: 10,
      INT: 10,
      WIS: 10,
      CHA: 10

    },

    abilities: []

  });


  save();

  render();

}


function deletePlayer(id) {

  if(
    !confirm(
      "Deze speler verwijderen?"
    )
  ) return;


  players =
    players.filter(
      p => p.id !== id
    );


  save();

  render();

}


/* =========================
   MOVES
========================= */

function addAbility(
  playerId
) {

  const player =
    players.find(
      p => p.id === playerId
    );


  player.abilities.push({

    id: Date.now(),

    name: "Nieuwe move",

    damage: "0",

    requirement: "Geen",

    description: ""

  });


  save();

  render();

}


function deleteAbility(
  playerId,
  abilityId
) {

  const player =
    players.find(
      p => p.id === playerId
    );


  player.abilities =
    player.abilities.filter(
      a => a.id !== abilityId
    );


  save();

  render();

}


/* =========================
   IMAGE
========================= */

function compressImage(
  file,
  callback
) {

  const reader =
    new FileReader();


  reader.onload =
    function(e) {

      const img =
        new Image();


      img.onload =
        function() {

          const max =
            500;

          let width =
            img.width;

          let height =
            img.height;


          if(width > max) {

            height =
              Math.round(
                height *
                max /
                width
              );

            width =
              max;

          }


          const canvas =
            document.createElement(
              "canvas"
            );


          canvas.width =
            width;

          canvas.height =
            height;


          canvas
            .getContext("2d")
            .drawImage(
              img,
              0,
              0,
              width,
              height
            );


          callback(
            canvas.toDataURL(
              "image/jpeg",
              0.82
            )
          );

        };


      img.src =
        e.target.result;

    };


  reader.readAsDataURL(file);

}


function handleImageUpload(
  playerId,
  input
) {

  const file =
    input.files[0];


  if(!file) return;


  compressImage(
    file,
    image => {

      const player =
        players.find(
          p => p.id === playerId
        );


      player.image =
        image;


      save();

      render();

    }
  );

}


function removeImage(
  playerId
) {

  const player =
    players.find(
      p => p.id === playerId
    );


  player.image = "";

  save();

  render();

}


/* =========================
   HTML VEILIG
========================= */

function escapeHtml(value) {

  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}


/* =========================
   RENDER
========================= */

function render() {

  const container =
    document.getElementById(
      "players"
    );


  if(players.length === 0) {

    container.innerHTML = `

      <div class="empty">

        Nog geen spelers.

        <br><br>

        Klik op
        <b>＋ Player</b>.

      </div>

    `;

    return;

  }


  container.innerHTML =
    players.map(
      player => `

      <div class="player">

        <div class="player-header">

          <input

            value="${escapeHtml(
              player.name
            )}"

            onchange="
              playerNameChanged(
                ${player.id},
                this.value
              )
            "

          >

          <button
            class="danger small"
            onclick="
              deletePlayer(
                ${player.id}
              )
            "
          >
            Verwijder
          </button>

        </div>


        <div class="player-overview">


          <div class="image-box">

            ${
              player.image

              ?

              `<img
                class="character-image"
                src="${player.image}"
              >`

              :

              `<div
                class="image-placeholder"
              >
                🧙
              </div>`

            }


            <div class="image-controls">

              <label
                class="file-label"
              >

                📷 Kies afbeelding

                <input
                  class="file-input"
                  type="file"
                  accept="image/*"
                  onchange="
                    handleImageUpload(
                      ${player.id},
                      this
                    )
                  "
                >

              </label>

              ${
                player.image

                ?

                `<br><br>
                 <button
                   class="danger small"
                   onclick="
                     removeImage(
                       ${player.id}
                     )
                   "
                 >
                   Verwijder foto
                 </button>`

                :

                ""

              }

            </div>

          </div>


          <div class="stats">

            ${STAT_NAMES.map(
              stat => `

              <div class="stat">

                <label>
                  ${stat}
                </label>

                <input
                  type="number"
                  value="${
                    Number(
                      player.stats[stat]
                    ) || 0
                  }"
                  onchange="
                    statChanged(
                      ${player.id},
                      '${stat}',
                      this.value
                    )
                  "
                >

              </div>

              `
            ).join("")}

          </div>

        </div>


        <h3 class="section-title">
          ⚔️ Abilities / Moves
        </h3>


        <div class="abilities">

          ${
            player.abilities.length

            ?

            player.abilities.map(
              ability => `

              <div class="ability">

                <div class="ability-grid">

                  <input
                    placeholder="Naam"
                    value="${escapeHtml(
                      ability.name
                    )}"
                    onchange="
                      abilityChanged(
                        ${player.id},
                        ${ability.id},
                        'name',
                        this.value
                      )
                    "
                  >

                  <input
                    placeholder="Damage"
                    value="${escapeHtml(
                      ability.damage
                    )}"
                    onchange="
                      abilityChanged(
                        ${player.id},
                        ${ability.id},
                        'damage',
                        this.value
                      )
                    "
                  >

                  <input
                    placeholder="Requirement"
                    value="${escapeHtml(
                      ability.requirement
                    )}"
                    onchange="
                      abilityChanged(
                        ${player.id},
                        ${ability.id},
                        'requirement',
                        this.value
                      )
                    "
                  >

                </div>


                <textarea
                  placeholder="Kleine beschrijving..."
                  onchange="
                    abilityChanged(
                      ${player.id},
                      ${ability.id},
                      'description',
                      this.value
                    )
                  "
                >${escapeHtml(
                  ability.description
                )}</textarea>


                <br>

                <button
                  class="danger small"
                  onclick="
                    deleteAbility(
                      ${player.id},
                      ${ability.id}
                    )
                  "
                >
                  Verwijder move
                </button>

              </div>

              `
            ).join("")

            :

            `<div style="color:#8e8298">
              Nog geen moves.
            </div>`

          }

        </div>


        <br>

        <button
          onclick="
            addAbility(
              ${player.id}
            )
          "
        >
          ＋ Move / Ability
        </button>


      </div>

      `
    ).join("");

}


/* =========================
   EDIT FUNCTIES
========================= */

function playerNameChanged(
  id,
  value
) {

  const player =
    players.find(
      p => p.id === id
    );

  if(player) {

    player.name =
      value;

    save();

  }

}


function statChanged(
  id,
  stat,
  value
) {

  const player =
    players.find(
      p => p.id === id
    );

  if(player) {

    player.stats[stat] =
      Number(value) || 0;

    save();

  }

}


function abilityChanged(
  playerId,
  abilityId,
  property,
  value
) {

  const player =
    players.find(
      p => p.id === playerId
    );


  const ability =
    player?.abilities.find(
      a => a.id === abilityId
    );


  if(ability) {

    ability[property] =
      value;

    save();

  }

}


/* =========================
   START
========================= */

loadUser();

</script>
