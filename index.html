<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DND For Us</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #100d18;
  color: #eee;
}

header {
  padding: 20px;
  text-align: center;
  background: #1b1428;
  border-bottom: 1px solid #3b2a52;
}

h1 {
  margin: 0 0 12px;
  color: #c9a7ff;
}

button {
  border: 0;
  border-radius: 8px;
  padding: 9px 13px;
  background: #6d3bb5;
  color: white;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #824bd0;
}

button.danger {
  background: #8d3030;
}

button.small {
  padding: 6px 9px;
  font-size: 12px;
}

.container {
  max-width: 1100px;
  margin: 20px auto;
  padding: 0 14px;
}

.players {
  display: grid;
  gap: 20px;
}

.player {
  background: #1a1523;
  border: 1px solid #3a2a4c;
  border-radius: 14px;
  padding: 18px;
  box-shadow: 0 8px 25px #0004;
}

/* PLAYER NAAM */

.player-header {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 16px;
}

.player-header input {
  flex: 1;
  font-size: 20px;
  font-weight: bold;
  background: #0f0c15;
  color: white;
  border: 1px solid #49365d;
  border-radius: 8px;
  padding: 10px;
}

/* PLAATJE + STATS */

.player-overview {
  display: grid;
  grid-template-columns: 170px 1fr;
  gap: 20px;
  align-items: start;
}

/* AFBEELDING */

.image-box {
  text-align: center;
}

.character-image {
  width: 160px;
  height: 160px;
  border-radius: 12px;
  border: 2px solid #60477a;
  background: #0f0c15;
  object-fit: cover;
  display: block;
  margin: auto;
}

.image-placeholder {
  width: 160px;
  height: 160px;
  border-radius: 12px;
  border: 2px dashed #60477a;
  background: #0f0c15;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: auto;
  font-size: 46px;
  color: #6f607d;
}

.image-controls {
  margin-top: 10px;
  display: flex;
  justify-content: center;
  gap: 7px;
  flex-wrap: wrap;
}

.file-label {
  display: inline-block;
  background: #6d3bb5;
  color: white;
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
}

.file-label:hover {
  background: #824bd0;
}

.file-input {
  display: none;
}

/* STATS */

.stats {
  display: grid;
  grid-template-columns: repeat(2, minmax(130px, 1fr));
  gap: 10px;
}

.stat {
  background: #110e17;
  border: 1px solid #3d2c4e;
  border-radius: 9px;
  padding: 10px;
}

.stat label {
  display: block;
  color: #bfaed0;
  font-size: 12px;
  margin-bottom: 5px;
}

.stat input {
  width: 100%;
  background: #211a2c;
  color: white;
  border: 1px solid #4a385b;
  border-radius: 6px;
  padding: 8px;
  font-size: 18px;
}

/* ABILITIES */

.section-title {
  margin: 22px 0 10px;
  color: #c9a7ff;
}

.abilities {
  display: grid;
  gap: 10px;
}

.ability {
  background: #120f18;
  border: 1px solid #3d2c4e;
  border-radius: 10px;
  padding: 12px;
}

.ability-grid {
  display: grid;
  grid-template-columns: 1.2fr .7fr .9fr;
  gap: 8px;
}

.ability input,
.ability textarea {
  width: 100%;
  background: #211a2c;
  color: white;
  border: 1px solid #4a385b;
  border-radius: 6px;
  padding: 8px;
}

.ability textarea {
  min-height: 65px;
  resize: vertical;
  margin-top: 8px;
}

.ability-actions {
  display: flex;
  justify-content: flex-end;
  margin-top: 8px;
}

.empty {
  text-align: center;
  color: #8e8298;
  padding: 40px;
}

/* MOBIEL */

@media (max-width: 650px) {
  .player-overview {
    grid-template-columns: 1fr;
  }

  .image-box {
    margin: auto;
  }

  .stats {
    grid-template-columns: repeat(2, 1fr);
  }

  .ability-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>

  <h1>⚔️ DND For Us</h1>

  <button onclick="addPlayer()">
    ＋ Player
  </button>

  <button onclick="resetAll()" class="danger">
    Reset
  </button>

</header>


<div class="container">

  <div id="players" class="players"></div>

</div>


<script>

const STORAGE_KEY = "dnd-for-us-v1";

const STAT_NAMES = [
  "STR",
  "DEX",
  "CON",
  "INT",
  "WIS",
  "CHA"
];


let players = loadPlayers();


/* =========================
   OPSLAAN / LADEN
========================= */

function loadPlayers() {

  try {

    return JSON.parse(
      localStorage.getItem(STORAGE_KEY)
    ) || [];

  } catch (e) {

    return [];

  }

}


function save() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(players)
  );

}


/* =========================
   PLAYER TOEVOEGEN
========================= */

function addPlayer() {

  if (players.length >= 5) {

    alert(
      "Je kunt maximaal 5 spelers toevoegen."
    );

    return;
  }


  players.push({

    id: Date.now(),

    name: "Nieuwe speler",

    image: "",

    stats: {

      STR: 10,
      DEX: 10,
      CON: 10,
      INT: 10,
      WIS: 10,
      CHA: 10

    },

    abilities: []

  });


  save();

  render();

}


/* =========================
   PLAYER VERWIJDEREN
========================= */

function deletePlayer(id) {

  if (
    !confirm(
      "Deze speler verwijderen?"
    )
  ) {

    return;

  }


  players =
    players.filter(
      p => p.id !== id
    );


  save();

  render();

}


/* =========================
   ALLES RESETTEN
========================= */

function resetAll() {

  if (
    !confirm(
      "Alles verwijderen?"
    )
  ) {

    return;

  }


  players = [];

  save();

  render();

}


/* =========================
   PLAYER UPDATEN
========================= */

function updatePlayer(
  id,
  callback
) {

  const player =
    players.find(
      p => p.id === id
    );


  if (!player) {

    return;

  }


  callback(player);

  save();

}


/* =========================
   MOVE TOEVOEGEN
========================= */

function addAbility(playerId) {

  updatePlayer(
    playerId,
    p => {

      p.abilities.push({

        id: Date.now(),

        name: "Nieuwe move",

        damage: "0",

        requirement: "Geen",

        description: ""

      });

    }
  );


  render();

}


/* =========================
   MOVE VERWIJDEREN
========================= */

function deleteAbility(
  playerId,
  abilityId
) {

  updatePlayer(
    playerId,
    p => {

      p.abilities =
        p.abilities.filter(
          a => a.id !== abilityId
        );

    }
  );


  render();

}


/* =========================
   AFBEELDING KLEINER MAKEN
========================= */

function compressImage(
  file,
  callback
) {

  const reader =
    new FileReader();


  reader.onload = function(e) {

    const img =
      new Image();


    img.onload = function() {

      const maxSize = 500;

      let width =
        img.width;

      let height =
        img.height;


      if (width > height) {

        if (width > maxSize) {

          height =
            Math.round(
              height *
              maxSize /
              width
            );

          width = maxSize;

        }

      } else {

        if (height > maxSize) {

          width =
            Math.round(
              width *
              maxSize /
              height
            );

          height = maxSize;

        }

      }


      const canvas =
        document.createElement(
          "canvas"
        );


      canvas.width = width;

      canvas.height = height;


      const ctx =
        canvas.getContext(
          "2d"
        );


      ctx.drawImage(
        img,
        0,
        0,
        width,
        height
      );


      callback(
        canvas.toDataURL(
          "image/jpeg",
          0.82
        )
      );

    };


    img.src = e.target.result;

  };


  reader.readAsDataURL(file);

}


/* =========================
   AFBEELDING UPLOADEN
========================= */

function handleImageUpload(
  playerId,
  input
) {

  const file =
    input.files[0];


  if (!file) {

    return;

  }


  if (
    !file.type.startsWith(
      "image/"
    )
  ) {

    alert(
      "Kies een afbeelding."
    );

    return;

  }


  compressImage(
    file,
    function(dataUrl) {

      updatePlayer(
        playerId,
        p => {

          p.image = dataUrl;

        }
      );


      render();

    }
  );

}


/* =========================
   AFBEELDING VERWIJDEREN
========================= */

function removeImage(
  playerId
) {

  updatePlayer(
    playerId,
    p => {

      p.image = "";

    }
  );


  render();

}


/* =========================
   HTML VEILIG MAKEN
========================= */

function escapeHtml(value) {

  return String(value ?? "")

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================
   PAGINA TEKENEN
========================= */

function render() {

  const container =
    document.getElementById(
      "players"
    );


  if (players.length === 0) {

    container.innerHTML = `

      <div class="empty">

        Nog geen spelers.

        <br><br>

        Klik op
        <b>＋ Player</b>
        om te beginnen.

      </div>

    `;

    return;

  }


  container.innerHTML =

    players.map(
      player => `

      <div class="player">


        <!-- PLAYER NAAM -->

        <div class="player-header">

          <input

            value="${escapeHtml(
              player.name
            )}"

            onchange="

              updatePlayer(
                ${player.id},
                p => p.name =
                this.value
              )

            "

            aria-label="Speler naam"

          >


          <button

            class="danger small"

            onclick="
              deletePlayer(
                ${player.id}
              )
            "

          >

            Verwijder

          </button>

        </div>



        <!-- PLAATJE + STATS -->

        <div class="player-overview">


          <!-- AFBEELDING -->

          <div class="image-box">


            ${
              player.image

              ?

              `

              <img

                class="character-image"

                src="${player.image}"

                alt="Karakter afbeelding"

              >

              `

              :

              `

              <div class="image-placeholder">

                🧙

              </div>

              `

            }


            <div class="image-controls">


              <label class="file-label">

                📷 Kies afbeelding

                <input

                  class="file-input"

                  type="file"

                  accept="image/*"

                  onchange="
                    handleImageUpload(
                      ${player.id},
                      this
                    )
                  "

                >

              </label>


              ${
                player.image

                ?

                `

                <button

                  class="small danger"

                  onclick="
                    removeImage(
                      ${player.id}
                    )
                  "

                >

                  Verwijder foto

                </button>

                `

                :

                ""

              }


            </div>

          </div>



          <!-- STATS -->

          <div class="stats">


            ${

              STAT_NAMES.map(

                stat => `

                <div class="stat">

                  <label>

                    ${stat}

                  </label>


                  <input

                    type="number"

                    value="${
                      Number(
                        player.stats[stat]
                      ) || 0
                    }"

                    onchange="

                      updatePlayer(
                        ${player.id},

                        p =>

                        p.stats.${stat}
                        =
                        Number(
                          this.value
                        ) || 0

                      )

                    "

                  >

                </div>

                `

              ).join("")

            }


          </div>

        </div>



        <!-- ABILITIES -->

        <h3 class="section-title">

          ⚔️ Abilities / Moves

        </h3>


        <div class="abilities">


          ${

            player.abilities.length

            ?

            player.abilities.map(

              ability => `

              <div class="ability">


                <div class="ability-grid">


                  <!-- NAAM -->

                  <input

                    placeholder="Naam"

                    value="${escapeHtml(
                      ability.name
                    )}"

                    onchange="

                      updatePlayer(

                        ${player.id},

                        p =>

                        p.abilities
                        .find(
                          a =>
                          a.id ===
                          ${ability.id}
                        )
                        .name =
                        this.value

                      )

                    "

                  >


                  <!-- DAMAGE -->

                  <input

                    placeholder="Damage"

                    value="${escapeHtml(
                      ability.damage
                    )}"

                    onchange="

                      updatePlayer(

                        ${player.id},

                        p =>

                        p.abilities
                        .find(
                          a =>
                          a.id ===
                          ${ability.id}
                        )
                        .damage =
                        this.value

                      )

                    "

                  >


                  <!-- REQUIREMENT -->

                  <input

                    placeholder="Requirement"

                    value="${escapeHtml(
                      ability.requirement
                    )}"

                    onchange="

                      updatePlayer(

                        ${player.id},

                        p =>

                        p.abilities
                        .find(
                          a =>
                          a.id ===
                          ${ability.id}
                        )
                        .requirement =
                        this.value

                      )

                    "

                  >

                </div>



                <!-- BESCHRIJVING -->

                <textarea

                  placeholder="Kleine beschrijving..."

                  onchange="

                    updatePlayer(

                      ${player.id},

                      p =>

                      p.abilities
                      .find(
                        a =>
                        a.id ===
                        ${ability.id}
                      )
                      .description =
                      this.value

                    )

                  "

                >${escapeHtml(
                  ability.description
                )}</textarea>



                <!-- MOVE VERWIJDEREN -->

                <div class="ability-actions">

                  <button

                    class="danger small"

                    onclick="

                      deleteAbility(

                        ${player.id},

                        ${ability.id}

                      )

                    "

                  >

                    Verwijder move

                  </button>

                </div>


              </div>

              `

            ).join("")

            :

            `

            <div
              style="color:#8e8298"
            >

              Nog geen moves.

            </div>

            `

          }


        </div>


        <br>


        <button

          onclick="
            addAbility(
              ${player.id}
            )
          "

        >

          ＋ Move / Ability

        </button>


      </div>

      `
    ).join("");

}


/* =========================
   START
========================= */

render();

</script>

</body>
</html>
