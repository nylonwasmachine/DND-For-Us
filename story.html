<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DND For Us — Teen Years</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#100d18;color:#fff;display:flex;align-items:center;justify-content:center;padding:20px}
.story{width:min(850px,100%);background:#1a1523;border:1px solid #3a2a4c;border-radius:20px;padding:40px;text-align:center;box-shadow:0 20px 60px #0008}
.badge{display:inline-block;padding:7px 12px;border-radius:999px;background:#3d2860;color:#d8bdff;font-size:12px;font-weight:bold;letter-spacing:.06em}
h1{color:#c9a7ff;font-size:clamp(2rem,6vw,4rem);margin:20px 0 10px}
p{color:#b9aed0;line-height:1.6}
.wip{margin:30px 0;padding:28px;border:1px dashed #72559a;border-radius:16px;background:#14101c}
.wip strong{display:block;font-size:2rem;color:#fff;margin-bottom:8px}
button{border:0;border-radius:8px;padding:10px 14px;background:#6d3bb5;color:#fff;font-weight:bold;cursor:pointer}
button:hover{background:#824bd0}
#error{color:#ffb3b3}
</style>
</head>
<body>
<div class="story">
  <span class="badge">TEEN YEARS • 2006 • JJK</span>
  <h1>Story Mode</h1>
  <p id="partyName">Laden...</p>
  <div class="wip">
    <strong>WORK IN PROGRESS</strong>
    <span>De Teen Years story mode komt hier.</span>
  </div>
  <p id="error"></p>
  <button onclick="logout()">Uitloggen</button>
</div>
<script>
const SUPABASE_URL="https://smrmzoljzglgqzdjvqjl.supabase.co";
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtcm16b2xqemdsZ3F6ZGp2cWpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NjgwNTgsImV4cCI6MjEwNjQ0NDA1OH0.JBBu1_-X5X31cDx0URk2o1xIHJF55REsMhiiqJR-XTk';
// De echte anon key wordt hieronder uit session storage gehaald wanneer index.html hem beschikbaar maakt.
// Als deze pagina zelfstandig wordt geopend, vul dezelfde Supabase anon key in als in index.html.
const client=window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function logout(){await client.auth.signOut();location.href="index.html";}
async function init(){
  const {data:{user}}=await client.auth.getUser();
  if(!user){location.href="index.html";return;}
  const partyId=new URLSearchParams(location.search).get("party");
  if(!partyId){document.getElementById("error").textContent="Geen party gevonden.";return;}
  const {data:party,error}=await client.from("parties").select("id,name,status").eq("id",partyId).single();
  if(error||!party){document.getElementById("error").textContent="Deze party bestaat niet meer.";return;}
  const {data:member}=await client.from("party_members").select("user_id").eq("party_id",partyId).eq("user_id",user.id).maybeSingle();
  if(!member){document.getElementById("error").textContent="Je bent geen lid van deze party.";return;}
  if(party.status!=="started"){location.href="index.html";return;}
  document.getElementById("partyName").textContent=party.name;
}
init();
</script>
</body>
</html>
